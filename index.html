      --line: #423361;
      --shadow: 0 10px 28px -10px rgba(0, 0, 0, 0.55);
      --c-do: #ff6b6b;
      --c-re: #ffa35c;
      --c-mi: #f2cf52;
      --c-fa: #5fcb82;
      --c-sol: #5cacea;
      --c-la: #9c86ea;
      --c-si: #e37bcb;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Heebo', 'Segoe UI', sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg-top), var(--bg-bottom));
    min-height: 100vh;
    padding: clamp(14px, 3vw, 36px);
    /* A fixed site-wide "back to Sol's worlds" widget (outside this file, injected at the
       hanibarsol.github.io domain level) sits pinned in the top-right corner (~90px tall). Push
       all page content below it so nothing — like the do-re-mi-...-do character row on the
       finale screen — ever renders underneath it. */
    padding-top: max(96px, clamp(14px, 3vw, 36px));
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 1080px;
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 2.6vw, 30px);
  }

  /* ---------- Header ---------- */

  .hero {
    text-align: center;
    padding: clamp(10px, 2vw, 18px) 8px 2px;
    position: relative;
  }

  .hero .clef {
    font-family: serif;
    font-size: clamp(28px, 4vw, 40px);
    color: var(--ink-soft);
    opacity: 0.55;
    display: block;
    margin-bottom: 2px;
  }

  h1 {
    font-family: 'Secular One', 'Heebo', sans-serif;
    font-weight: 400;
    font-size: clamp(1.7rem, 4vw, 2.5rem);
    margin: 0 0 8px;
    text-wrap: balance;
    background: linear-gradient(90deg, var(--c-do), var(--c-re), var(--c-mi), var(--c-fa), var(--c-sol), var(--c-la), var(--c-si));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    font-size: clamp(0.95rem, 1.6vw, 1.15rem);
    color: var(--ink-soft);
    margin: 0 auto;
    max-width: 42em;
    line-height: 1.5;
  }

  /* ---------- Status bar ---------- */

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .pill-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .score-pill {
    display: flex;
    align-items: baseline;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 20px;
    box-shadow: var(--shadow);
    font-family: 'Heebo', sans-serif;
  }

  .score-label {
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .score-value {
    font-family: 'Secular One', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 1.4rem;
    color: var(--accent);
    min-width: 1.6em;
    text-align: center;
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--dot-color, var(--ink-soft));
    background: transparent;
    transition: background 0.25s ease, transform 0.25s ease;
  }

  .dot.filled {
    background: var(--dot-color, var(--accent));
    transform: scale(1.15);
  }

  #sequenceDots {
    display: flex;
    gap: 8px;
    direction: ltr;
    justify-content: center;
    margin-bottom: 10px;
  }

  .replay-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 auto 16px;
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease;
  }

  .replay-btn:hover { transform: translateY(-2px); }
  .replay-btn:active { transform: scale(0.96); }
  .replay-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  #startBtn {
    background: var(--playful);
    font-size: 1.05rem;
    padding: 13px 30px;
  }

  .replay-icon {
    width: 20px;
    height: 20px;
  }

  /* ---------- Stage ---------- */

  .stage {
    position: relative;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-tint) 100%);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: clamp(20px, 3.4vw, 34px) clamp(10px, 3vw, 26px) clamp(26px, 3.4vw, 34px);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .staff-lines {
    position: absolute;
    inset: 0;
    top: 46%;
    height: 30%;
    background-image: repeating-linear-gradient(
      to bottom,
      var(--line) 0,
      var(--line) 1.5px,
      transparent 1.5px,
      transparent 20%
    );
    opacity: 0.6;
    pointer-events: none;
  }

  .slots-track {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: clamp(6px, 1.8vw, 18px);
    overflow-x: auto;
    padding: 6px 4px 8px;
    scrollbar-width: thin;
  }

  .slot {
    --note-color: var(--ink-soft);
    position: relative;
    flex: 0 0 auto;
    width: clamp(68px, 11.5vw, 112px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: riseIn 0.55s ease backwards;
  }

  /* All 7 characters (do..si) must fit in one row without needing an internal sideways scroll —
     a young child won't discover that .slots-track scrolls on its own. The 68px floor above is
     too wide for 7 slots on a phone or portrait tablet, so shrink it here instead of relying on
     the vw-based clamp (which never drops below that floor no matter how narrow the screen is). */
  @media (max-width: 900px) {
    .slots-track {
      gap: 4px;
      padding: 6px 2px 8px;
    }
    .slot {
      width: calc((100% - 6 * 4px) / 7);
    }
    .slot-name {
      font-size: 0.72rem;
    }
    .slot-number {
      font-size: 0.65rem;
    }
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slot-number {
    font-family: 'Secular One', sans-serif;
    font-size: 0.75rem;
    color: var(--note-color);
    opacity: 0.7;
  }

  .slot-arch {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 50% 50% 10px 10px;
    border: 3px solid color-mix(in srgb, var(--note-color) 38%, transparent);
    background: radial-gradient(120% 100% at 50% 20%, color-mix(in srgb, var(--note-color) 16%, transparent), transparent 70%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.25s ease, transform 0.15s ease, opacity 0.2s ease;
    animation: breathe 2.6s ease-in-out infinite;
    cursor: pointer;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }

  .slot.lit .slot-arch {
    animation: slotLitFlash 0.32s ease;
    border-width: 4px;
    border-color: var(--note-color);
    background: var(--note-color);
    z-index: 3;
  }

  @keyframes slotLitFlash {
    0% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--note-color) 20%, transparent); transform: scale(1); }
    40% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--note-color) 55%, transparent), 0 0 44px 16px color-mix(in srgb, var(--note-color) 80%, transparent); transform: scale(1.18); }
    100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--note-color) 20%, transparent); transform: scale(1); }
  }

  .slot.lit .slot-name {
    color: var(--note-color);
    transform: scale(1.18);
  }

  .slot.dim .slot-arch {
    opacity: 0.4;
    transform: scale(0.96);
  }

  .slot.dim .slot-name {
    opacity: 0.5;
  }

  .slot.shake .slot-arch {
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-6px) rotate(-3deg); }
    40% { transform: translateX(5px) rotate(3deg); }
    60% { transform: translateX(-4px) rotate(-2deg); }
    80% { transform: translateX(3px) rotate(2deg); }
  }

  .slot-media {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .slot-media img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
  }

  .slot-name {
    font-family: 'Secular One', sans-serif;
    font-size: clamp(0.8rem, 1.4vw, 0.98rem);
    color: var(--note-color);
    display: inline-block;
    transition: transform 0.15s ease, color 0.15s ease, opacity 0.2s ease;
  }

  .score-float {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Secular One', sans-serif;
    color: var(--note-color);
    font-size: 1rem;
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 6px) scale(0.8); }
    25% { opacity: 1; transform: translate(-50%, -6px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -38px) scale(1); }
  }

  /* ---------- Celebration ---------- */

  .celebrate-overlay {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--ink) 55%, transparent);
    backdrop-filter: blur(3px);
  }

  #confettiCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .celebrate-card {
    position: relative;
    background: var(--surface);
    border-radius: 26px;
    padding: clamp(26px, 5vw, 44px) clamp(24px, 6vw, 52px);
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
    max-width: 380px;
  }

  .celebrate-card h2 {
    font-family: 'Secular One', sans-serif;
    font-weight: 400;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    margin: 0 0 10px;
    color: var(--accent);
  }

  .celebrate-card p {
    color: var(--ink-soft);
    margin: 0 0 14px;
    line-height: 1.5;
  }

  .final-score {
    font-family: 'Secular One', sans-serif;
    font-size: 1.2rem;
    margin-bottom: 20px;
  }

  .btn-primary {
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 12px 32px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease;
  }

  .btn-primary:hover { transform: translateY(-2px); }
  .btn-primary:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>

  var slotsTrack = document.getElementById("slotsTrack");
  var sequenceDots = document.getElementById("sequenceDots");
  var startBtn = document.getElementById("startBtn");
  var replaySeqBtn = document.getElementById("replaySeqBtn");
  var scoreEl = document.getElementById("score");
  var roundValueEl = document.getElementById("roundValue");
  var pageSubtitle = document.getElementById("pageSubtitle");
  var celebrateOverlay = document.getElementById("celebrateOverlay");
  var celebrateTitle = document.getElementById("celebrateTitle");
  var celebrateText = document.getElementById("celebrateText");
  var finalScoreEl = document.getElementById("finalScore");
  var nextBtn = document.getElementById("nextBtn");

  var score = 0;
  var slotEls = {};
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var roundLengths = [2, 3, 4, 5, 6];
  var round = 0;
  var sequence = [];
  var userIndex = 0;
  var locked = true;
  var timeouts = [];

  /* ---------- Audio ---------- */

  var audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, startTime, duration, gainPeak, type) {
    var ctx = getCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(gainPeak, startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  function playSuccess(freq) {
    var ctx = getCtx();
    var t = ctx.currentTime;
    tone(freq, t, 0.42, 0.18, "sine");
    tone(freq * 2, t, 0.3, 0.06, "sine");
  }

  function playBonus() {
    var ctx = getCtx();
    var t = ctx.currentTime;
    tone(587.33, t, 0.12, 0.14, "triangle");
    tone(739.99, t + 0.07, 0.12, 0.14, "triangle");
    tone(987.77, t + 0.14, 0.28, 0.16, "triangle");
  }

  function playError() {
    var ctx = getCtx();
    var t = ctx.currentTime;
    tone(233, t, 0.16, 0.08, "sine");
    tone(207, t + 0.11, 0.2, 0.08, "sine");
  }

  function playWin() {
    var ctx = getCtx();
    var t = ctx.currentTime;
    var freqs = CHARACTERS.map(function (c) { return c.freq; }).concat([523.25]);
    freqs.forEach(function (f, i) {
      tone(f, t + i * 0.13, 0.32, 0.14, "triangle");
    });
  }

  /* ---------- Build keypad ---------- */

  CHARACTERS.forEach(function (ch, index) {
    var slot = document.createElement("div");
    slot.className = "slot";
    slot.dataset.key = ch.key;
    slot.style.setProperty("--note-color", "var(--c-" + ch.key + ")");
    slot.style.animationDelay = (index * 0.07) + "s";

    var number = document.createElement("div");
    number.className = "slot-number";
    number.textContent = String(index + 1);

    var arch = document.createElement("div");
    arch.className = "slot-arch";
    arch.style.animationDelay = (index * 0.35) + "s";
    var media = document.createElement("div");
    media.className = "slot-media";
    var img = document.createElement("img");
    img.src = ch.img;
    img.alt = ch.name;
    media.appendChild(img);
    arch.appendChild(media);

    var name = document.createElement("div");
    name.className = "slot-name";
    name.textContent = ch.name;

    slot.appendChild(number);
    slot.appendChild(arch);
    slot.appendChild(name);
    slot.addEventListener("click", onKeypadTap);
    slotsTrack.appendChild(slot);
    slotEls[ch.key] = { root: slot, media: media };
  });

  function bumpScore(el, amount) {
    score += amount;
    scoreEl.textContent = String(score);
    var pop = document.createElement("div");
    pop.className = "score-float";
    pop.textContent = "+" + amount;
    el.style.position = "relative";
    el.appendChild(pop);
    setTimeout(function () { pop.remove(); }, 950);
  }

  function clearTimeouts() {
    timeouts.forEach(function (id) { clearTimeout(id); });
    timeouts = [];
  }

  function litSlot(key, duration) {
    var slot = slotEls[key].root;
    slot.classList.add("lit");
    CHARACTERS.forEach(function (c) {
      if (c.key !== key) slotEls[c.key].root.classList.add("dim");
    });
    var ch = CHARACTERS.filter(function (c) { return c.key === key; })[0];
    playSuccess(ch.freq);
    setTimeout(function () {
      slot.classList.remove("lit");
      CHARACTERS.forEach(function (c) { slotEls[c.key].root.classList.remove("dim"); });
    }, duration);
  }

  function buildSequenceDots(length) {
    sequenceDots.innerHTML = "";
    for (var i = 0; i < length; i++) {
      var dot = document.createElement("div");
      dot.className = "dot";
      sequenceDots.appendChild(dot);
    }
  }

  function markSequenceDot(index) {
    var dots = sequenceDots.querySelectorAll(".dot");
    if (dots[index]) dots[index].classList.add("filled");
  }

  function startRound() {
    clearTimeouts();
    locked = true;
    var length = roundLengths[round];
    roundValueEl.textContent = (round + 1) + "/" + roundLengths.length;

    sequence = [];
    for (var i = 0; i < length; i++) {
      sequence.push(CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)].key);
    }
    userIndex = 0;
    buildSequenceDots(length);
    pageSubtitle.textContent = "תראו ותקשיבו לרצף...";

    timeouts.push(setTimeout(playSequence, 800));
  }

  function playSequence() {
    var noteDur = 520;
    sequence.forEach(function (key, i) {
      timeouts.push(setTimeout(function () {
        litSlot(key, noteDur - 140);
      }, i * noteDur));
    });
    var totalTime = sequence.length * noteDur + 200;
    timeouts.push(setTimeout(function () {
      locked = false;
      pageSubtitle.textContent = "עכשיו תורכם! הקישו על הדמויות באותו סדר.";
    }, totalTime));
  }

  function onKeypadTap(e) {
    if (locked) return;
    var slot = e.currentTarget;
    var key = slot.dataset.key;
    var expected = sequence[userIndex];

    if (key === expected) {
      litSlot(key, 260);
      markSequenceDot(userIndex);
      userIndex++;
      if (userIndex === sequence.length) {
        locked = true;
        playBonus();
        bumpScore(slot, 15);
        pageSubtitle.textContent = "מעולה! ממשיכים...";
        timeouts.push(setTimeout(advanceRound, 1300));
      }
    } else {
      litSlot(key, 260);
      playError();
      slot.classList.add("shake");
      timeouts.push(setTimeout(function () { slot.classList.remove("shake"); }, 400));
      userIndex = 0;
      buildSequenceDots(sequence.length);
      pageSubtitle.textContent = "כמעט! נסו שוב, או לחצו על \"השמיעו שוב\" כדי לשמוע את הרצף.";
    }
  }

  function advanceRound() {
    round++;
    if (round >= roundLengths.length) {
      setTimeout(celebrate, 400);
    } else {
      startRound();
    }
  }

  function startGame() {
    round = 0;
    score = 0;
    scoreEl.textContent = "0";
    sequenceDots.hidden = false;
    replaySeqBtn.hidden = false;
    startRound();
  }

  startBtn.addEventListener("click", function () {
    getCtx();
    startBtn.hidden = true;
    startGame();
  });

  replaySeqBtn.addEventListener("click", function () {
    getCtx();
    clearTimeouts();
    locked = true;
    userIndex = 0;
    buildSequenceDots(sequence.length);
    pageSubtitle.textContent = "מקשיבים שוב לרצף...";
    playSequence();
  });

  /* ---------- Celebration ---------- */

  var confettiRAF = null;

  function celebrate() {
    playWin();
    finalScoreEl.textContent = String(score);
    celebrateOverlay.hidden = false;
    if (!reducedMotion) startConfetti();
  }

  function startConfetti() {
    var canvas = document.getElementById("confettiCanvas");
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    function resize() {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();

    var colors = ["--c-do", "--c-re", "--c-mi", "--c-fa", "--c-sol", "--c-la", "--c-si"].map(function (v) {
      return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    });

    var pieces = [];
    for (var i = 0; i < 140; i++) {
      pieces.push({
        x: Math.random() * window.innerWidth,
        y: -20 - Math.random() * window.innerHeight,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 10,
        color: colors[i % colors.length],
        speed: 1.6 + Math.random() * 2.4,
        drift: (Math.random() - 0.5) * 1.6,
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * 0.2
      });
    }

    var start = performance.now();
    function frame(now) {
      var elapsed = now - start;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      pieces.forEach(function (p) {
        p.y += p.speed;
        p.x += p.drift;
        p.rot += p.rotSpeed;
        if (p.y > window.innerHeight + 20) p.y = -20;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (elapsed < 6000 && !celebrateOverlay.hidden) {
        confettiRAF = requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }
    confettiRAF = requestAnimationFrame(frame);
  }

  nextBtn.addEventListener("click", function () {
    if (confettiRAF) cancelAnimationFrame(confettiRAF);
    celebrateOverlay.hidden = true;
    startGame();
  });
})();
</script>

</body></html>
